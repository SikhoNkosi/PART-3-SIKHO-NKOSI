name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore RaceDay.API.slnx

      - name: Build solution
        run: dotnet build RaceDay.API.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Run tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --verbosity normal
